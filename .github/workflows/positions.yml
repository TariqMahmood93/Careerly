name: Collect open positions

# Reads ALL open calls from Bandi MUR, EURAXESS and jobs.ac.uk into data/positions.json.
# Runs every morning before the Claude daily search (05:15 Rome summer time / 04:15 winter).
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-positions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep the Supabase project awake (free projects pause after 7 idle days)
        continue-on-error: true
        run: curl -fsS -o /dev/null -w "Supabase auth health: %{http_code}\n" -H "apikey: sb_publishable_I6ffqrAWnfFTabDv2w9oFA_NeuVmZXa" https://kipuqqslpnmpixsdtvir.supabase.co/auth/v1/health
      - name: Collect positions
        timeout-minutes: 70
        run: python3 -u scripts/fetch_positions.py --out data/positions.json
      - name: Save results
        if: always()
        run: |
          [ -f data/positions.json ] || { echo "Nothing collected"; exit 0; }
          git config user.name "careerly-bot"
          git config user.email "careerly-bot@users.noreply.github.com"
          git add data/positions.json data/positions-cache.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Collect open positions ($(date -u +%F))"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
