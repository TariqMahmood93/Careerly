name: Probe job sites (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try EURAXESS URL variants
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          try() {
            ids=$(curl -sSL -A "$UA" -H "Accept-Language: en" --max-time 40 "$1" | grep -o 'href="/jobs/[0-9]*"' | grep -o '[0-9]*' | head -10 | tr '\n' ' ')
            echo "$1 => $ids"
          }
          try 'https://euraxess.ec.europa.eu/jobs/search'
          try 'https://euraxess.ec.europa.eu/jobs/search?page=1'
          try 'https://euraxess.ec.europa.eu/jobs/search?page=3'
          try 'https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_field%3A78'
          try 'https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_field%3A78&page=1'
          try 'https://euraxess.ec.europa.eu/jobs/search?keywords=machine%20learning&f%5B0%5D=job_research_field%3A78'
          try 'https://euraxess.ec.europa.eu/jobs/search?keys=machine%20learning'
          try 'https://euraxess.ec.europa.eu/jobs/search?search_api_fulltext=machine%20learning'
          try 'https://euraxess.ec.europa.eu/jobs/search?keywords=deep%20learning'
          try 'https://euraxess.ec.europa.eu/jobs/search?keywords=deep%20learning&page=2'
          curl -sSL -A "$UA" --max-time 40 'https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_field%3A78' | grep -o 'Filter by [^"]*' | sort | uniq -c | sort -rn | head -40
